name: drift-ci

on:
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC = 09:30 Vientiane
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force a failure to test the Telegram notify path"
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q -o addopts=

  validate-hermes-main:
    # The drift gate: install Hermes from NousResearch/hermes-agent main and
    # run the same admission checks the catalog runs. PyPI hermes-agent is
    # v0.19 and predates `plugins validate`, so main is installed editable
    # (upstream blocks wheel/sdist builds).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4
      - name: Install Hermes from main (locked env)
        # Upstream's build backend blocks wheel/sdist builds and editable
        # installs pull no dependencies — the supported route is uv sync
        # against the repo's own lockfile.
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes
          cd /tmp/hermes
          uv sync --frozen
      - name: hermes plugins doctor --ci
        run: /tmp/hermes/.venv/bin/hermes plugins doctor "$GITHUB_WORKSPACE" --ci
      - name: hermes plugins validate
        run: /tmp/hermes/.venv/bin/hermes plugins validate "$GITHUB_WORKSPACE"
      - name: Forced failure (notify-path test)
        if: ${{ inputs.force_fail == true }}
        run: exit 1

  notify:
    needs: [test, validate-hermes-main]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: "${{ inputs.force_fail == 'true' && format('🧪 TEST — notify-path check (safe to ignore): {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || format('🔴 global-business-culture drift-ci FAILED ({0}) — {1}/{2}/actions/runs/{3}', github.event_name, github.server_url, github.repository, github.run_id) }}"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok, chat = os.environ.get("TG_TOKEN"), os.environ.get("TG_CHAT")
          if not tok or not chat:
              print("::warning::Telegram secrets not set — skipping ping")
              raise SystemExit(0)
          req = urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % tok,
              data=json.dumps({"chat_id": chat, "text": os.environ["MSG"]}).encode(),
              headers={"Content-Type": "application/json"})
          resp = json.load(urllib.request.urlopen(req, timeout=30))
          raise SystemExit(0 if resp.get("ok") is True else 1)
          PY
